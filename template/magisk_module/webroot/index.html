<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Il2CppDumper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background: #0f172a;
            min-height: 100vh;
            padding: 20px;
            color: #e2e8f0;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
            background: #1e293b;
            border-radius: 14px;
            padding: 24px;
            border: 1px solid #334155;
        }
        h1 { font-size: 22px; margin-bottom: 4px; color: #38bdf8; }
        .ver { color: #fbbf24; font-size: 12px; margin-bottom: 8px; font-weight: 700; }
        .sub { color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
        .card {
            background: #0f172a;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #334155;
        }
        .row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #1e293b;
            font-size: 14px;
        }
        .row:last-child { border-bottom: none; }
        .label { color: #94a3b8; flex-shrink: 0; }
        .value { font-weight: 600; text-align: right; word-break: break-all; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #e2e8f0;
        }
        .hint, .cmd {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 12px;
            word-break: break-all;
        }
        .cmd {
            background: #020617;
            color: #86efac;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }
        .btn-primary { background: #0284c7; }
        .btn-secondary { background: #334155; }
        .btn:active { opacity: 0.85; }
        #msg {
            margin-top: 8px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            min-height: 20px;
            background: #334155;
            color: #e2e8f0;
        }
        #msg.ok { background: #14532d; color: #86efac; }
        #msg.err { background: #450a0a; color: #fca5a5; }
    </style>
</head>
<body>
<div class="container">
    <h1>Il2CppDumper</h1>
    <div class="ver" id="ver">webui-5 · 对齐 zygisk-il2cpp-mcp 的 ksu.exec</div>
    <p class="sub">输入包名 → 保存 → 冷启动游戏</p>

    <div class="card">
        <div class="row"><span class="label">当前包名</span><span class="value" id="curPkg">-</span></div>
        <div class="row"><span class="label">输出路径</span><span class="value" id="outPath">-</span></div>
        <div class="row"><span class="label">ksu</span><span class="value" id="bridge">-</span></div>
    </div>

    <label for="pkgInput">目标包名</label>
    <input id="pkgInput" type="text" placeholder="com.game.example" autocomplete="off" value="">
    <p class="hint">配置：/data/adb/modules/zygisk_il2cppdumper/target_package</p>
    <p class="cmd" id="cmdHint">su -c 'echo 包名 > /data/adb/modules/zygisk_il2cppdumper/target_package'</p>

    <button class="btn btn-primary" type="button" id="btnSave">保存并用于 dump</button>
    <button class="btn btn-secondary" type="button" id="btnClear">清除配置</button>
    <button class="btn btn-secondary" type="button" id="btnReload">重新读取</button>
    <div id="msg">加载中…</div>
</div>

<script>
// 与 zygisk-il2cpp-mcp WebUI 相同：全局 ksu.exec(cmd, JSON.stringify(opts), callbackName)
var MOD = "/data/adb/modules/zygisk_il2cppdumper";
var CFG = MOD + "/target_package";
var _cb = 0;

function $(id) { return document.getElementById(id); }

function setMsg(text, cls) {
    $("msg").textContent = text;
    $("msg").className = cls || "";
}

function toast(t) {
    try { if (typeof ksu !== "undefined" && ksu.toast) ksu.toast(String(t)); } catch (e) {}
}

function hasKsu() {
    return typeof ksu !== "undefined" && typeof ksu.exec === "function";
}

// 原样对齐 MCP: Zt(cmd, options) → Promise<{errno,stdout,stderr}>
function ksuExec(cmd, options) {
    if (typeof options === "undefined") options = {};
    return new Promise(function (resolve, reject) {
        var name = "exec_callback_" + Date.now() + "_" + (_cb++);
        window[name] = function (errno, stdout, stderr) {
            resolve({ errno: errno, stdout: stdout, stderr: stderr });
            try { delete window[name]; } catch (e) { window[name] = undefined; }
        };
        try {
            ksu.exec(cmd, JSON.stringify(options), name);
        } catch (e) {
            try { delete window[name]; } catch (e2) { window[name] = undefined; }
            reject(e);
        }
    });
}

function applyPkg(pkg) {
    $("curPkg").textContent = pkg ? pkg : "未设置";
    if (pkg) $("pkgInput").value = pkg;
    $("outPath").textContent = pkg ? ("/data/data/" + pkg + "/files/dump.cs") : "保存后显示";
    $("cmdHint").textContent = "su -c 'echo " + (pkg || "com.xxx") + " > /data/adb/modules/zygisk_il2cppdumper/target_package'";
}

function validPkg(p) {
    return !!p && p.indexOf(".") > 0 && /^[A-Za-z0-9_.]+$/.test(p);
}

function noBridgeMsg() {
    applyPkg("");
    $("bridge").textContent = "无";
    setMsg("无 ksu 桥接（Magisk 自带 WebUI 往往没有）。请用 KernelSU/SukiSU WebUI，或终端执行绿色命令。", "err");
    toast("无 ksu 桥接");
}

async function loadCurrent() {
    if (!hasKsu()) { noBridgeMsg(); return; }
    $("bridge").textContent = "ksu.exec";
    setMsg("正在读取…");
    try {
        var r = await ksuExec('cat "' + CFG + '" 2>/dev/null || true');
        var pkg = String(r.stdout || "").replace(/\r/g, "").split("\n")[0].trim();
        applyPkg(pkg);
        setMsg(pkg ? ("已读取: " + pkg) : "尚未设置包名", pkg ? "ok" : "");
    } catch (e) {
        setMsg("读取失败: " + e, "err");
    }
}

async function onSave() {
    var pkg = $("pkgInput").value.replace(/\s+/g, "");
    setMsg("点击保存: " + (pkg || "(空)"));
    toast("保存…");
    if (!validPkg(pkg)) {
        setMsg("包名无效，示例: com.game.example", "err");
        return;
    }
    applyPkg(pkg);
    if (!hasKsu()) {
        $("cmdHint").textContent = "su -c 'echo " + pkg + " > /data/adb/modules/zygisk_il2cppdumper/target_package'";
        noBridgeMsg();
        return;
    }
    setMsg("正在写入…");
    var cmd = "mkdir -p '" + MOD + "' && printf '%s\\n' '" + pkg + "' > '" + CFG + "' && cat '" + CFG + "'";
    try {
        var r = await ksuExec(cmd);
        var saved = String(r.stdout || "").replace(/\r/g, "").split("\n")[0].trim();
        if (saved === pkg) {
            setMsg("保存成功，请强停游戏后冷启动", "ok");
            toast("已保存 " + pkg);
            return;
        }
        setMsg("写入异常 errno=" + r.errno + " out=" + saved + " err=" + (r.stderr || ""), "err");
    } catch (e) {
        setMsg("写入失败: " + e, "err");
    }
}

async function onClear() {
    setMsg("点击清除");
    if (!hasKsu()) {
        $("cmdHint").textContent = "su -c 'rm -f /data/adb/modules/zygisk_il2cppdumper/target_package'";
        noBridgeMsg();
        return;
    }
    try {
        await ksuExec("rm -f '" + CFG + "'");
        applyPkg("");
        setMsg("已清除", "ok");
        toast("已清除");
    } catch (e) {
        setMsg("清除失败: " + e, "err");
    }
}

$("btnSave").onclick = function () { onSave(); };
$("btnClear").onclick = function () { onClear(); };
$("btnReload").onclick = function () { loadCurrent(); };
$("pkgInput").oninput = function () {
    var p = $("pkgInput").value.replace(/\s+/g, "");
    if (p) $("cmdHint").textContent = "su -c 'echo " + p + " > /data/adb/modules/zygisk_il2cppdumper/target_package'";
};

$("bridge").textContent = hasKsu() ? "ksu.exec" : "无";
setMsg("webui-5 已加载 · ksu=" + (hasKsu() ? "有" : "无"), hasKsu() ? "ok" : "err");
loadCurrent();
</script>
</body>
</html>
