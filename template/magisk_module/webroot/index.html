<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il2CppDumper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            padding: 20px;
            color: #e2e8f0;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
            background: #1e293b;
            border-radius: 14px;
            padding: 24px;
            border: 1px solid #334155;
        }
        h1 { font-size: 22px; margin-bottom: 6px; color: #38bdf8; }
        .sub { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        .card {
            background: #0f172a;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #334155;
        }
        .row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid #1e293b;
            font-size: 14px;
        }
        .row:last-child { border-bottom: none; }
        .label { color: #94a3b8; }
        .value { font-weight: 600; text-align: right; word-break: break-all; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 15px;
            margin-bottom: 8px;
        }
        .hint { font-size: 12px; color: #64748b; margin-bottom: 14px; }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .btn-primary { background: #0284c7; color: white; }
        .btn-secondary { background: #334155; color: #e2e8f0; }
        .btn:disabled { opacity: 0.5; }
        .msg {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }
        .msg.show { display: block; }
        .msg.ok { background: #14532d; color: #86efac; border: 1px solid #16a34a; }
        .msg.err { background: #450a0a; color: #fca5a5; border: 1px solid #dc2626; }
        .toast {
            position: fixed;
            left: 16px;
            right: 16px;
            bottom: 24px;
            padding: 14px 16px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .toast.show { opacity: 1; }
        .toast.ok { background: #16a34a; }
        .toast.err { background: #dc2626; }
    </style>
</head>
<body>
<div class="container">
    <h1>Il2CppDumper</h1>
    <p class="sub">Zygisk 运行时 dump · 输入包名保存后冷启动游戏</p>

    <div class="card">
        <div class="row"><span class="label">当前包名</span><span class="value" id="curPkg">读取中…</span></div>
        <div class="row"><span class="label">输出路径</span><span class="value" id="outPath">—</span></div>
    </div>

    <label for="pkgInput">目标包名</label>
    <input id="pkgInput" type="text" placeholder="com.game.example" autocomplete="off">
    <p class="hint">写入 /data/adb/modules/zygisk_il2cppdumper/target_package</p>

    <button class="btn btn-primary" id="btnSave" type="button">保存并用于 dump</button>
    <button class="btn btn-secondary" id="btnClear" type="button">清除配置</button>
    <div class="msg" id="msg"></div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
    import { exec } from 'kernelsu';

    const MOD = '/data/adb/modules/zygisk_il2cppdumper';
    const CFG = `${MOD}/target_package`;

    async function run(cmd) {
        try {
            const r = await Promise.resolve(exec(cmd));
            return { ok: r.errno === 0, out: (r.stdout || '').trim(), err: (r.stderr || '').trim() };
        } catch (e) {
            return { ok: false, out: '', err: String(e) };
        }
    }

    function feedback(text, ok) {
        const toast = document.getElementById('toast');
        toast.textContent = text;
        toast.className = `toast show ${ok ? 'ok' : 'err'}`;
        clearTimeout(feedback._t);
        feedback._t = setTimeout(() => toast.classList.remove('show'), 2500);

        const msg = document.getElementById('msg');
        msg.textContent = text;
        msg.className = `msg show ${ok ? 'ok' : 'err'}`;
    }

    function validPkg(p) {
        return /^[A-Za-z0-9_.]+$/.test(p) && p.includes('.');
    }

    async function loadCurrent() {
        const r = await run(`cat "${CFG}" 2>/dev/null || true`);
        const pkg = (r.out || '').split('\n')[0].trim();
        document.getElementById('curPkg').textContent = pkg || '未设置';
        document.getElementById('pkgInput').value = pkg || '';
        document.getElementById('outPath').textContent = pkg
            ? `/data/data/${pkg}/files/dump.cs`
            : '保存包名后显示';
    }

    async function savePkg() {
        const btn = document.getElementById('btnSave');
        btn.disabled = true;
        try {
            const pkg = document.getElementById('pkgInput').value.trim();
            if (!validPkg(pkg)) {
                feedback('包名无效，例如 com.game.example', false);
                return;
            }
            const r = await run(`mkdir -p "${MOD}" && printf '%s\\n' "${pkg}" > "${CFG}" && cat "${CFG}"`);
            const saved = (r.out || '').split('\n')[0].trim();
            if (r.ok && saved === pkg) {
                feedback('已保存，请完全杀掉游戏后冷启动', true);
            } else {
                feedback(`保存失败: ${r.err || r.out || '未知错误'}`, false);
            }
            await loadCurrent();
        } finally {
            btn.disabled = false;
        }
    }

    async function clearPkg() {
        const btn = document.getElementById('btnClear');
        btn.disabled = true;
        try {
            const r = await run(`rm -f "${CFG}"`);
            feedback(r.ok ? '已清除配置' : `清除失败: ${r.err || '未知错误'}`, r.ok);
            await loadCurrent();
        } finally {
            btn.disabled = false;
        }
    }

    document.getElementById('btnSave').addEventListener('click', savePkg);
    document.getElementById('btnClear').addEventListener('click', clearPkg);

    try {
        await loadCurrent();
    } catch (e) {
        document.getElementById('curPkg').textContent = '读取失败';
        feedback(`WebUI 初始化失败: ${e}`, false);
    }
</script>
</body>
</html>
